# Baixa o GTFS do Metrofor todo dia e publica os horários em JSON para a
# versão web, no ramo "dados" (fora da main, para não gerar um commit por dia
# no histórico do app). O navegador não consegue baixar o feed direto: o site
# não libera acesso de outras páginas (sem CORS). Por isso este espelho é da
# lite; o app Android baixa a grade só do Metrofor (daqui, só o regras.json).
name: Dados da versão web

on:
  schedule:
    # Horário de Fortaleza (UTC−3). O Metrofor publica a grade do dia logo
    # depois da meia-noite (em 25/10, a da eleição, já estava lá às 00:33), e o
    # GitHub atrasa os agendamentos em até ~5 h, mais na hora cheia. Por isso
    # cinco tentativas de madrugada, em minutos quebrados (00:47, 01:17, 01:47,
    # 02:47 e 04:17): quem abre o app às 5h já acha a grade de hoje. Nada antes
    # das 00:40: o feed não diz de que dia é (nem no zip nem no feed_info.txt) e
    # o espelho guarda a grade pelo dia em que baixou; antes da troca, guardaria
    # a de ontem como a de hoje (a de sexta como a de sábado). O GitHub só atrasa,
    # nunca adianta. As de 10:00, 15:00 e 20:00 corrigem falhas do site ou
    # mudanças durante o dia.
    # A grade muda também durante o dia (04/11: seis versões da Linha Sul até as
    # 12h27), e a lite só a vê por aqui: de 05:17 a 23:47, a cada 30 min. Só
    # publica se mudou. O disparo principal é o do cron-job.org (o GitHub atrasa
    # e pula agendamentos); estes são a reserva. Nenhum entre 00:00 e 00:40.
    - cron: "17,47 8-23 * * *"
    - cron: "17,47 0-2 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"
    - cron: "47 4 * * *"
    - cron: "47 5 * * *"
    - cron: "17 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-web
  cancel-in-progress: false

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir o ramo dados (ou criar, na primeira vez)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin dados; then
            git worktree add out FETCH_HEAD
            git -C out switch -c dados
          else
            git worktree add --detach out
            git -C out switch --orphan dados
          fi

      - name: Gerar os horários
        env:
          TZ: America/Fortaleza
        run: python3 tools/build_web_data.py out

      - name: Publicar se mudou
        run: |
          cd out
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -q -m "Horários de $(date +%F)"
            git push origin dados
          fi
